name: Daily Art checks

on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: aureth-labs/dsh-aurabot-qq
          ref: 0a0ccb1cc401dee00ce0faac2cffbf57d0efecda
          path: host
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/checkout@v4
        with:
          repository: aureth-labs/dsh-aurabot-qq-mods
          ref: 94a2b955d7c7fe9b5e84584a8e6f67d3752b2477
          path: market
          persist-credentials: false
      - name: Build the module with the official market scripts
        run: |
          mkdir market/modules/daily-art
          cp -r index.mjs panel.js module.json lib README.md LICENSE market/modules/daily-art/
          cd market
          npm run catalog
          npm run check
          npm run pack -- --only daily-art
      - name: Test module and install on the unmodified host
        env:
          AURABOT_PLUGIN_DIR: ${{ github.workspace }}/host
          DA_MARKET_DIST: ${{ github.workspace }}/market/dist
        run: node --test 'test/*.test.js'
